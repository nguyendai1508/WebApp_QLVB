<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 320px;
            margin: 0;
            padding: 20px;
            background-color: #f8fafc;
            color: #1e293b;
            text-align: center;
        }
        .header {
            margin-bottom: 20px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 10px;
        }
        h2 {
            margin: 0;
            color: #1d4ed8;
            font-size: 18px;
        }
        .status {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .button {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .button:hover {
            background-color: #2563eb;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Đồng bộ QLVB Firebase</h2>
    </div>
    
    <div class="status">
        Hệ thống đồng bộ đang hoạt động ẩn.<br>
        Bạn có thể bấm <b>Đồng bộ</b> ngay trên giao diện Web App hoặc có thể bấm Nút Nổi trên trang VNPT Đồng Nai.
    </div>

    <button id="btnOpenWebApp" class="button">Mở Web App QLVB</button>
    
    <div class="footer">
        QLVB Sync v2.0 - Tích hợp Firebase
    </div>

    <script src="popup.js"></script>
</body>
</html>
