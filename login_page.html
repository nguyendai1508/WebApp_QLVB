            function clickButtonDangNhapHeThong(e, buttonid) {
                var evt = e ? e : window.event;

                    $(this).removeAttr("readonly");

            showP();
            function showP() {
                var togglePassword = document.querySelector('#togglePassword');
                var password = document.querySelector('#txtMatKhau');

                togglePassword.addEventListener('click', function (e) {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    this.classList.toggle('fa-eye-slash');
                });
            }

                    "description": "Tác giả: <a target='_blank' href=''></a>"
                }

            ];

            obj = shuffle(items); console.log(obj[prebg].filename);
            $(".background").css("background-image", 'url(/Assets/img/bglogin/' + obj[prebg].filename + ')');
            $("#info-box .title").html(obj[prebg].title);
            prebg++;

            function shuffle(o) {
                for (var j, x, i = o.length; i; j = Math.floor(Math.random() * i), x = o[--i], o[i] = o[j], o[j] = x);
                return o;
            }

            function changeBg(val) {
                if (prebg >= obj.length - 1) { prebg = 0 };
                if (val >= 0) { prebg = prebg - 2 };
                if (prebg < 0) { prebg = 0; };
                $(".background").fadeOut('100', function () {
                    $(".background").css("background-image", 'url(/Assets/img/bglogin/' + obj[prebg].filename + ')')
                        .fadeIn('100');
                });

                prebg++;
                $("#info-box .title").html(obj[prebg].title);
            };

            function AutoChangeBg() { if (play) changeBg(); }

            function ToggleAll() {
                if ($("#header").is(':visible')) {
                    $('#command-box .fullscreen-btn').css("background-position", "-64px -53px");
                    $('#loginform').css("opacity", "0.5");
                } else {
                    $('#command-box .fullscreen-btn').css("background-position", "-32px -53px");
                    $('#loginform').css("opacity", "1");
                }
                $('#footer').toggle("slow");
                $('#header').toggle("slow");
                $('#news-box').toggle("slow");
                $('#Headline').toggle("slow");

            };

            $(window).load(function () {
                var myTimer = setInterval(AutoChangeBg, timer);

                $('.fullscreen-btn').click(function () {
                    ToggleAll();
                });

                $('#loginform input').focus(function () {
                    if ($("#header").is(':hidden')) { ToggleAll() }
                });
                $('.next-btn').click(function () {
                    changeBg();
                    clearInterval(myTimer);
                    myTimer = setInterval(AutoChangeBg, timer);
                });

                $('.pre-btn').click(function () {
                    changeBg(prebg);
                    clearInterval(myTimer);
                    myTimer = setInterval(AutoChangeBg, timer);
                });

                $('.play-btn').click(function () {

                    if (play) {
                        $('#command-box .play-btn').css("background-position", "-0px -85px");
                        play = false;
                    } else {
                        $('#command-box .play-btn').css("background-position", "-32px -85px");
                        play = true;
                    }
                });

                $(".info-btn").click(function () {
                    $("#info-box .title").toggle("slow");
                    $("#info-box").toggleClass("info-box-bg");
                    setTimeout(function () {
                        $("#command-box").removeClass('hover');
                    }, 3000);

                });

                $("#command-box").hover(function () {
                    if ($("#command-box").hasClass('hover')) {
                        return true;
                    } else {
                        $("#command-box").addClass('hover');
                        $("#info-box .title").show("slow");
                        $("#info-box").addClass("info-box-bg");
                        return false;
                    }

                });
            });
        </script>
